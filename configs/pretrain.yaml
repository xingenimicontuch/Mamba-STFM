stage: pretrain
dataset: harmonized_public_mi
signal:
  sample_rate: 250
  window_seconds: 4.0
  stride_seconds: 0.25
  low_hz: 4.0
  high_hz: 40.0
  notch_hz: 50.0
  patch_samples: 25
model:
  channels: 22
  classes: 4
  dimension: 128
  state_dimension: 128
  expansion: 2
  convolution_width: 4
  blocks: 6
  clusters: 4
  dropout: 0.1
  bidirectional: true
  descriptor_min_samples: 64
mask:
  cluster_ratio: 0.5
  band_ratio: 0.5
  time_ratio: 0.5
  decoder_dimension: 64
optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.05
  epochs: 200
  batch_size: 64
  gradient_accumulation: 1
  gradient_clip: 1.0
  warmup_epochs: 0
  scheduler: cosine
runtime:
  seeds: [0]
  workers: 8
  precision: fp32
  distributed_backend: nccl
  output_directory: runs
  device: auto
