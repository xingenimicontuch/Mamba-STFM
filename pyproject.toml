[build-system]
requires = ["setuptools==75.3.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba-stfm"
version = "1.0.0"
description = "Mamba spatio-temporal EEG foundation model"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "torch==2.4.1",
  "scikit-learn==1.5.2",
  "PyYAML==6.0.2",
  "mne==1.8.0",
  "moabb==1.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-cov==5.0.0", "ruff==0.7.3", "mypy==1.13.0", "types-PyYAML==6.0.12.20240917"]

[project.scripts]
mamba-stfm-train = "mamba_stfm.commands.train:main"
mamba-stfm-evaluate = "mamba_stfm.commands.evaluate:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["code"]

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["mamba_stfm"]
mypy_path = "code"
ignore_missing_imports = true
disable_error_code = ["no-any-return", "attr-defined", "name-defined"]
